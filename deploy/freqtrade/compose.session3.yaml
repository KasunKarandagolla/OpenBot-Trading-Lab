name: openbot-session3-research
services:
  research3:
    image: freqtradeorg/freqtrade:2026.10@sha256:0cc4b6dc9b16e0516d27efae1765e925da7d6aea5c8f3c3825930ffe3098d7c7
    working_dir: /lab
    entrypoint: [python, /lab/scripts/research_session3.py]
    volumes:
      - ../../:/lab
      - ../../configs:/lab/configs:ro
      - ../../scripts:/lab/scripts:ro
      - ../../research:/lab/research:ro
      - ../../user_data/strategies:/lab/user_data/strategies:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
