name: Read-only researcher Session 1
on:
  push:
    branches: [feature/external-first-market-researcher]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m researcher config validate
